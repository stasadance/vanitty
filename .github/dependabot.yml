version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      ignore:
          # TypeScript 7 breaks the build. Bump it by hand when we're ready.
          - dependency-name: typescript
            update-types: ["version-update:semver-major"]
      groups:
          npm-security:
              applies-to: security-updates
              patterns: ["*"]
          npm:
              patterns: ["*"]
              update-types: [minor, patch]
          npm-major:
              patterns: ["*"]
              update-types: [major]
    - package-ecosystem: cargo
      directory: /src-tauri
      schedule:
          interval: monthly
      groups:
          cargo-security:
              applies-to: security-updates
              patterns: ["*"]
          cargo:
              patterns: ["*"]
              update-types: [minor, patch]
          cargo-major:
              patterns: ["*"]
              update-types: [major]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]
