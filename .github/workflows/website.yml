name: Website

# Builds the Astro site in website/ and publishes it to GitHub Pages.
on:
    push:
        branches: [main]
        paths: ["website/**", "docs/assets/**", "src/config/**", ".github/workflows/website.yml"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: website
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  package_json_file: website/package.json
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: website/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - uses: actions/configure-pages@v6
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
            # Tells Bing, Yandex and the other IndexNow engines which pages changed. The key
            # is public by design; the engines check it against website/public/<key>.txt.
            - name: Notify IndexNow
              continue-on-error: true
              env:
                  KEY: afda91eb47bd0aa4b5d0f7efd561cbbf
              run: |
                  urls=$(curl -fsSL https://vanitty.dev/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
                  curl -fsS -X POST https://api.indexnow.org/indexnow \
                      -H 'Content-Type: application/json; charset=utf-8' \
                      -d "{\"host\":\"vanitty.dev\",\"key\":\"$KEY\",\"urlList\":$urls}"
