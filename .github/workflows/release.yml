name: Release

# Builds installers for Windows, Linux and macOS and attaches them to a GitHub
# release tagged v<version>. Runs when a change to package.json lands on main
# (the PR `pnpm release` opens), or by hand from the Actions tab. Skips when
# the version in package.json is already released.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag
        id: tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.released == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          # One universal app for Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles that the in-app updater downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Vanitty ${{ needs.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: See the assets below to download and install Vanitty.
          # Appends the merged PRs since the last release (see .github/release.yml).
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          # latest.json points Windows updates at the setup.exe that install.ps1 uses.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
