[package]
name = "vanitty"
version = "26.10.5"
description = "A fast, native terminal built with Rust and Tauri"
license = "MIT"
edition = "2024"
repository = "https://github.com/stasadance/vanitty"
# Run `pnpm build` first: the crate embeds the UI from dist/. gen/schemas is
# listed so tauri-build's output matches the package during `cargo publish`.
include = [
  "/src",
  "/build.rs",
  "/tauri.conf.json",
  "/capabilities",
  "/icons",
  "/dist",
  "/gen/schemas",
]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vanitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "7"
open = "5"
ureq = { version = "3", features = ["json", "platform-verifier"] }
flate2 = "1"
tar = "0.4"
nodejs-semver = "7"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
objc2 = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
