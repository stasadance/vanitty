[package]
name = "vanitty"
version = "0.1.0"
description = "A fast, native terminal built with Rust and Tauri"
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vanitty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "7"
ureq = { version = "3", features = ["json", "platform-verifier"] }
flate2 = "1"
tar = "0.4"
nodejs-semver = "7"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
